# This workflow installs node dependencies, builds the source code,
# and runs tests across supported Node.js versions.
# Notes:
# - Vite 7 requires Node.js 20.19 or newer, so Node 18 is not in the matrix.
# - The project has no package-lock.json yet, so it uses `npm install`
#   instead of `npm ci`, and it does not use the npm cache.
#   After you commit a package-lock.json, you can switch back to `npm ci`
#   and add `cache: 'npm'`.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
